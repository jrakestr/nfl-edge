[project]
name = "nfl-edge"
version = "0.1.0"
description = "Correlated NFL game simulation feeding betting lines, player props, and DFS lineups from one set of draws."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy @ git+https://github.com/jrakestr/nflreadpy.git",
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "supabase>=2.0",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "pulp>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "jupyter"]

[project.scripts]
nfl-edge = "nfl_edge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_edge"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not db'"
markers = [
  "network: requires internet access to nflverse releases",
  "db: requires DATABASE_URL and local parquet draws; run with -m db",
]
