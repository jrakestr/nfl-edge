# Simulator parameters. Every output reads from the draws produced under these settings.
draws_per_game: 20000
seed: 2026
priors:
  lookback_weeks: 8          # current-season row weight = exp(-(W - week) / lookback_weeks)
  prior_season_weight: 0.35  # weight of every prior-season row (blend-in baseline)
  shrink_to_ffopportunity: 0.5  # 0 = ignore _exp stats, 1 = fully trust them
  shrink_k_team: 4           # team rates: pseudo-games toward league average
  shrink_k_usage: 3          # player shares: pseudo-games toward positional average share
  shrink_k_targets: 40       # receiving efficiency: pseudo-targets toward positional average
  shrink_k_carries: 60       # rushing efficiency: pseudo-carries toward positional average
  # priors-refine
  shrink_k_qb_att: 150       # QB yards/att: pseudo-attempts toward league YPA
  qb_factor_clip: [0.8, 1.2] # qb_pass_factor = starter YPA / team lookback YPA, clipped
  qb_ppd_elasticity: 0.6     # team off_ppd scales by qb_pass_factor ** elasticity
  qb_att_share_prior: 0.97   # starter share of team pass attempts, shrunk toward this
  shrink_k_qb_share: 3       # pseudo-games for qb_att_share
  cold_start_frac: 0.6       # depth-chart-only players get frac * rank_factor * positional mean share
  cold_start_rank_factor: {1: 1.0, 2: 0.6, 3: 0.35}
team:
  plays_per_game_sd: 6
  pass_rate_sd: 0.03        # per-draw noise around the script-adjusted pass rate
  home_field_pts: 1.5
  rest_advantage_per_day: 0.15
  weather_wind_threshold_mph: 15
players:
  usage_concentration: 40    # Dirichlet concentration for share draws (higher = tighter)
  td_rate_sd: 0.01
  fumble_lost_rate: 0.01     # per touch (carry or reception)
  yds_gamma_shape_per_rec: 1.0    # Gamma shape per reception for rec yards (lower = heavier tail)
  yds_gamma_shape_per_carry: 0.8  # Gamma shape per carry for rush yards
checks:
  max_total_gap_vs_market: 6.0   # warn if fair total differs from market by more
  max_spread_gap_vs_market: 4.0
